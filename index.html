<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold &amp; Split — prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#15171a; --ink-2:#5b6169; --ink-3:#8b9199;
    --line:#e2e5e9; --panel:#ffffff; --bg:#eef0f3; --accent:#F84464;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  header{padding:20px 28px 0 28px}
  h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-0.2px}
  .sub{margin-top:3px;font-size:13px;color:var(--ink-2)}

  .tabs{display:flex;gap:8px;margin:18px 28px 0 28px;border-bottom:1px solid var(--line)}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
       padding:10px 2px 12px;margin-right:22px;font:inherit;font-size:14px;font-weight:500;
       color:var(--ink-2);cursor:pointer;text-align:left}
  .tab small{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

  .layout{display:flex;gap:28px;padding:20px 28px 28px 28px;align-items:flex-start}

  .rail{width:252px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
  .rail h2{margin:8px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.6px;
           text-transform:uppercase;color:var(--ink-3)}
  .item{display:flex;align-items:center;gap:10px;width:100%;appearance:none;background:none;border:0;
        padding:9px 10px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--ink);
        cursor:pointer;text-align:left}
  .item:hover{background:#f4f6f8}
  .item[aria-current="true"]{background:#fdeef1;color:#b4253f;font-weight:500}
  .code{flex:none;min-width:38px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.3px}
  .item[aria-current="true"] .code{color:#b4253f}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{width:413px;height:872px;background:#0e1013;border-radius:42px;padding:10px;
         box-shadow:0 18px 48px rgba(16,19,24,.26)}
  iframe{width:393px;height:852px;border:0;border-radius:33px;background:#fff;display:block}

  .bar{display:flex;align-items:center;gap:10px;width:413px}
  .now{flex:1;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now b{color:var(--ink);font-weight:600}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;
       padding:7px 12px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:#c9ced5}

  .hint{width:413px;font-size:12px;line-height:17px;color:var(--ink-3)}
  .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
</style>
</head>
<body>

<header>
  <h1>Hold &amp; Split Prototype</h1>
  <div class="sub">BookMyShow group booking</div>
</header>

<div class="tabs" role="tablist" id="tabs"></div>

<div class="layout">
  <nav class="rail" aria-label="Screens">
    <h2 id="railTitle">Screens</h2>
    <div id="rail"></div>
  </nav>

  <div class="stage">
    <div class="phone"><iframe id="frame" title="Prototype screen"></iframe></div>
    <div class="bar">
      <div class="now" id="now"></div>
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn" id="restart" type="button">Restart flow</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script>
const state = { routes: null, tab: null, screen: null, history: [] };
const $ = (id) => document.getElementById(id);

fetch('routes.json')
  .then((r) => r.json())
  .then((routes) => { state.routes = routes; boot(); })
  .catch(() => {
    $('hint').innerHTML = 'Could not read <code>routes.json</code>. Serve this folder over http — '
      + 'e.g. <code>python3 -m http.server 8080</code> — rather than opening the file directly.';
  });

function boot() {
  const tabs = state.routes.tabs;
  $('tabs').innerHTML = tabs.map((t, i) =>
    `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${i === 0}">`
    + `${t.label}<small>${t.caption}</small></button>`).join('');
  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (b) selectTab(b.dataset.tab, true);
  });
  $('restart').addEventListener('click', () => {
    const t = tabOf(state.tab);
    state.history = [];
    go(t.entry);
  });
  $('back').addEventListener('click', () => {
    state.history.pop();
    const prev = state.history.pop();
    go(prev || tabOf(state.tab).entry);
  });
  $('frame').addEventListener('load', syncFromFrame);
  selectTab(tabs[0].id, true);
}

const tabOf = (id) => state.routes.tabs.find((t) => t.id === id);

function selectTab(id, navigate) {
  state.tab = id;
  document.querySelectorAll('.tab').forEach((b) =>
    b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  const t = tabOf(id);
  $('railTitle').textContent = t.label;
  $('rail').innerHTML = t.screens.map((s) =>
    `<button class="item" type="button" data-screen="${s}">`
    + `<span>${state.routes.screens[s].title}</span></button>`).join('');
  $('rail').onclick = (e) => {
    const b = e.target.closest('.item');
    if (b) { state.history = []; go(b.dataset.screen); }
  };
  if (navigate) { state.history = []; go(t.entry); }
  else markRail();
}

function go(screen) {
  state.screen = screen;
  $('frame').src = state.routes.screens[screen].file;
  markRail();
  describe();
}

function syncFromFrame() {
  let id = null;
  try { id = $('frame').contentDocument.body.dataset.screen; } catch (err) { id = null; }
  if (!id || !state.routes.screens[id]) {
    $('hint').innerHTML = 'Serve this folder over http — e.g. <code>python3 -m http.server 8080</code> — '
      + 'so the shell can follow taps inside the screen.';
    return;
  }
  if (state.history[state.history.length - 1] !== id) state.history.push(id);
  state.screen = id;
  const tab = state.routes.screens[id].tab;
  if (tab !== state.tab) selectTab(tab, false);
  markRail();
  describe();
}

function markRail() {
  document.querySelectorAll('.item').forEach((b) =>
    b.setAttribute('aria-current', String(b.dataset.screen === state.screen)));
}

function describe() {
  const s = state.routes.screens[state.screen];
  if (!s) return;
  $('now').innerHTML = `<b>${state.screen}</b> · ${s.title}`;
  const outs = state.routes.hotspots.filter((h) => h.from === state.screen);
  $('hint').textContent = outs.length
    ? 'Taps on this screen: ' + outs.map((h) => `${h.label} → ${h.to}`).join(' · ')
    : 'No taps on this screen — it is entered from a timer or a notification. Pick the next screen from the list.';
}
</script>
</body>
</html>
